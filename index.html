<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Займ"/>
<meta name="theme-color" content="#0a0f1e"/>
<title>Табыс</title><link rel="manifest" href="manifest.json"/>

<!-- PWA Manifest inline -->
<script>
const manifest = {
  name: "Табыс",
  short_name: "Займ",
  start_url: ".",
  display: "standalone",
  background_color: "#0a0f1e",
  theme_color: "#0a0f1e",
  orientation: "portrait",
  icons: [{
    src: "data:image/svg+xml;base64," + btoa(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='32' fill='%230a0f1e'/><text y='130' x='30' font-size='120'>💰</text></svg>`),
    sizes: "192x192", type: "image/svg+xml"
  }]
};
const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
const url = URL.createObjectURL(blob);
const link = document.createElement('link');
link.rel = 'manifest'; link.href = url;
document.head.appendChild(link);
</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Rubik:wght@400;500;700;900&display=swap');

:root {
  --bg: #070c18;
  --bg2: #0d1525;
  --bg3: #111e35;
  --border: #1a2d4a;
  --border2: #243d5e;
  --text: #dde6f0;
  --text2: #8ba5c4;
  --text3: #4d6a85;
  --green: #10e87a;
  --green2: #0ab55e;
  --green-bg: #071a0f;
  --blue: #4d9ef8;
  --blue2: #2d7de8;
  --blue-bg: #071325;
  --purple: #9d7cf8;
  --purple-bg: #110c25;
  --gold: #f5c842;
  --gold-bg: #1a1505;
  --red: #f85454;
  --red-bg: #200808;
  --radius: 14px;
  --tab-h: 64px;
  --header-h: 100px;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family: 'Rubik', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  position: relative;
}

/* Ambient glow */
body::before {
  content:'';
  position:fixed; top:-200px; left:-200px;
  width:500px; height:500px;
  background: radial-gradient(circle, #1a3d7030 0%, transparent 70%);
  pointer-events:none; z-index:0;
}

/* ─── HEADER ─── */
.header {
  position: fixed; top:0; left:0; right:0; z-index: 50;
  background: linear-gradient(180deg, #070c18 0%, #0a1020 100%);
  border-bottom: 1px solid var(--border);
  padding: env(safe-area-inset-top, 0) 0 0;
}
.header-inner {
  display: flex; align-items: center; gap:12px;
  padding: 14px 18px 12px;
}
.header-logo {
  width:40px; height:40px; border-radius:12px; flex-shrink:0;
  background: linear-gradient(135deg, #1d4ed8, #2563eb);
  display:flex; align-items:center; justify-content:center;
  font-size:22px;
  box-shadow: 0 0 20px #2563eb40;
}
.header-title { font-size:17px; font-weight:700; letter-spacing:-0.5px; }
.header-sub { font-size:10px; color:var(--text3); letter-spacing:1px; text-transform:uppercase; margin-top:1px; font-family:'JetBrains Mono',monospace; }
.header-date {
  margin-left:auto; font-family:'JetBrains Mono',monospace;
  font-size:11px; color:var(--blue); font-weight:600;
  background:var(--blue-bg); border:1px solid var(--border2);
  padding:5px 10px; border-radius:20px;
}

/* ─── TABS ─── */
.tabs {
  position: fixed; bottom:0; left:0; right:0; z-index:50;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  display: grid; grid-template-columns:1fr 1fr 1fr;
  padding: 0 0 env(safe-area-inset-bottom, 0);
  height: calc(var(--tab-h) + env(safe-area-inset-bottom, 0));
}
.tab-btn {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; border:none; background:transparent; cursor:pointer;
  color:var(--text3); transition:all 0.2s; padding:8px 0;
}
.tab-btn.active { color:var(--blue); }
.tab-icon { font-size:20px; line-height:1; }
.tab-label { font-size:9px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; font-family:'JetBrains Mono',monospace; }
.tab-dot {
  width:4px; height:4px; border-radius:50%;
  background: var(--blue); margin-top:2px;
  opacity:0; transition:opacity 0.2s;
}
.tab-btn.active .tab-dot { opacity:1; }

/* ─── BODY ─── */
.body {
  padding: calc(var(--header-h) + 12px) 16px calc(var(--tab-h) + 20px);
  position:relative; z-index:1;
  max-width:480px; margin:0 auto;
}

/* ─── CARDS ─── */
.card {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:var(--radius); padding:14px; margin-bottom:10px;
}

/* ─── KPI GRID ─── */
.kpi-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
.kpi {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:12px; padding:12px 14px; position:relative; overflow:hidden;
}
.kpi::before {
  content:''; position:absolute; top:-20px; right:-20px;
  width:60px; height:60px; border-radius:50%;
  opacity:0.08;
}
.kpi.green::before { background:var(--green); }
.kpi.blue::before  { background:var(--blue);  }
.kpi.purple::before{ background:var(--purple);}
.kpi.gold::before  { background:var(--gold);  }
.kpi-val { font-size:19px; font-weight:800; letter-spacing:-0.5px; font-family:'Rubik',sans-serif; }
.kpi.green .kpi-val { color:var(--green); }
.kpi.blue  .kpi-val { color:var(--blue);  }
.kpi.purple.kpi-val { color:var(--purple);}
.kpi.gold  .kpi-val { color:var(--gold);  }
.kpi-lbl { font-size:9px; color:var(--text3); text-transform:uppercase; letter-spacing:1px; margin-top:4px; font-family:'JetBrains Mono',monospace; }

/* ─── DATE PICKER ─── */
.date-row {
  display:flex; align-items:center; gap:8px; margin-bottom:14px;
}
.date-lbl { font-size:10px; color:var(--text3); white-space:nowrap; font-family:'JetBrains Mono',monospace; }
input[type=date] {
  flex:1; background:var(--bg3); border:1px solid var(--border2);
  color:var(--text); padding:9px 12px; border-radius:10px;
  font-size:13px; font-family:'Rubik',sans-serif;
  -webkit-appearance:none; outline:none;
}
input[type=date]:focus { border-color:var(--blue); }

/* ─── SECTION TITLE ─── */
.sec-title {
  font-size:9px; color:var(--text3); text-transform:uppercase;
  letter-spacing:2px; margin-bottom:8px;
  font-family:'JetBrains Mono',monospace;
  display:flex; align-items:center; gap:6px;
}
.sec-title::after {
  content:''; flex:1; height:1px; background:var(--border);
}

/* ─── BORROWER ROW ─── */
.b-row {
  display:flex; align-items:center; gap:10px;
  padding:11px 13px;
  background:var(--bg2); border:1px solid var(--border);
  border-radius:12px; margin-bottom:6px;
  transition:all 0.18s; cursor:pointer;
  -webkit-user-select:none; user-select:none;
}
.b-row.paid {
  background: var(--green-bg);
  border-color: #10e87a30;
  box-shadow: 0 0 12px #10e87a0a;
}
.b-row.inactive { opacity:0.35; cursor:default; }

.chk {
  width:26px; height:26px; border-radius:8px; flex-shrink:0;
  border:2px solid var(--border2); background:var(--bg3);
  display:flex; align-items:center; justify-content:center;
  font-size:14px; transition:all 0.15s; color:transparent;
}
.b-row.paid .chk {
  background: var(--green2);
  border-color: var(--green2);
  color: white;
  box-shadow: 0 0 10px #10e87a50;
}

.b-info { flex:1; min-width:0; }
.b-name { font-size:13px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.b-meta { display:flex; align-items:center; gap:6px; margin-top:2px; }
.b-day { font-size:9px; color:var(--text3); font-family:'JetBrains Mono',monospace; background:var(--bg3); padding:2px 7px; border-radius:4px; }
.b-day.last { color:var(--gold); background:var(--gold-bg); }
.b-day.done { color:var(--green); background:var(--green-bg); }

.b-amt { text-align:right; flex-shrink:0; }
.b-amt-val { font-size:14px; font-weight:700; color:var(--green); font-family:'JetBrains Mono',monospace; }
.b-amt-status { font-size:9px; color:var(--green2); margin-top:1px; }

/* ─── PROGRESS BAR ─── */
.progress-wrap { height:5px; background:var(--bg3); border-radius:99px; overflow:hidden; margin-top:6px; }
.progress-fill { height:100%; border-radius:99px; transition:width 0.4s cubic-bezier(.4,0,.2,1); }

/* ─── MONTH CARD ─── */
.month-card {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:var(--radius); padding:14px; margin-bottom:8px;
}
.month-name { font-size:14px; font-weight:700; color:var(--blue); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.stat-item { background:var(--bg3); border-radius:8px; padding:9px 10px; }
.stat-val { font-size:14px; font-weight:700; }
.stat-lbl { font-size:8px; color:var(--text3); text-transform:uppercase; letter-spacing:1px; margin-top:2px; font-family:'JetBrains Mono',monospace; }

/* ─── DAY HISTORY ROW ─── */
.day-row {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 13px; background:var(--bg2); border:1px solid var(--border);
  border-radius:10px; margin-bottom:5px; cursor:pointer;
  transition:border-color 0.15s;
}
.day-row:active { border-color:var(--blue); }

/* ─── BORROWER DETAIL CARD ─── */
.b-card {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:var(--radius); padding:14px; margin-bottom:10px;
}
.b-card-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
.b-card-name { font-size:14px; font-weight:700; }
.b-card-status { font-size:10px; margin-top:3px; }
.b-delete { background:none; border:none; color:var(--red); cursor:pointer; font-size:18px; padding:0 4px; }
.b-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:10px; }
.bs { background:var(--bg3); border-radius:8px; padding:8px 6px; text-align:center; }
.bs-val { font-size:12px; font-weight:700; }
.bs-lbl { font-size:7px; color:var(--text3); text-transform:uppercase; margin-top:2px; font-family:'JetBrains Mono',monospace; }

/* ─── ADD BUTTON ─── */
.add-btn {
  width:100%; background:linear-gradient(135deg,#1d4ed8,#3b82f6);
  color:#fff; border:none; border-radius:12px; padding:14px;
  font-size:13px; font-weight:700; cursor:pointer;
  letter-spacing:0.5px; font-family:'Rubik',sans-serif;
  box-shadow: 0 4px 20px #2563eb30;
  transition: all 0.15s;
  margin-top:4px;
}
.add-btn:active { transform:scale(0.98); }

/* ─── MODAL ─── */
.modal-overlay {
  position:fixed; inset:0; background:#00000090;
  display:flex; align-items:flex-end; z-index:200;
  backdrop-filter:blur(4px);
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal-card {
  background:var(--bg2); border-radius:20px 20px 0 0;
  padding:20px; width:100%; box-sizing:border-box;
  border-top:1px solid var(--border2);
  padding-bottom:calc(20px + env(safe-area-inset-bottom, 0));
  animation: slideUp 0.25s cubic-bezier(.4,0,.2,1);
  max-height:92vh; overflow-y:auto;
}
@keyframes slideUp { from{transform:translateY(40px);opacity:0} to{transform:translateY(0);opacity:1} }
.modal-title { font-size:15px; font-weight:700; margin-bottom:16px; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
.form-group { margin-bottom:10px; }
label { font-size:9px; color:var(--text3); display:block; margin-bottom:5px; text-transform:uppercase; letter-spacing:1px; font-family:'JetBrains Mono',monospace; }
input[type=text], input[type=number] {
  width:100%; background:var(--bg3); border:1px solid var(--border2);
  color:var(--text); padding:10px 12px; border-radius:10px;
  font-size:13px; font-family:'Rubik',sans-serif; outline:none;
  box-sizing:border-box;
}
input:focus { border-color:var(--blue); }
.preview-box {
  background:var(--bg3); border:1px solid var(--border);
  border-radius:10px; padding:12px; margin-bottom:14px;
}
.preview-row { display:flex; justify-content:space-between; padding:3px 0; }
.preview-lbl { font-size:10px; color:var(--text3); }
.preview-val { font-size:11px; font-weight:700; }
.btn-row { display:grid; grid-template-columns:1fr 2fr; gap:8px; }
.btn-cancel { background:var(--bg3); color:var(--text2); border:1px solid var(--border2); border-radius:10px; padding:13px; font-size:12px; font-weight:700; cursor:pointer; font-family:'Rubik',sans-serif; }
.btn-save { background:linear-gradient(135deg,#16a34a,#22c55e); color:#fff; border:none; border-radius:10px; padding:13px; font-size:12px; font-weight:700; cursor:pointer; font-family:'Rubik',sans-serif; }
.btn-save:disabled { opacity:0.4; cursor:not-allowed; }

/* ─── EMPTY STATE ─── */
.empty { text-align:center; padding:50px 20px; color:var(--text3); }
.empty-icon { font-size:44px; margin-bottom:12px; }
.empty-text { font-size:13px; line-height:1.6; }

/* ─── INSTALL BANNER ─── */
.install-banner {
  background:linear-gradient(135deg,#0f2d5e,#0a1e3d);
  border:1px solid var(--blue);
  border-radius:12px; padding:12px 14px;
  display:flex; align-items:center; gap:10px;
  margin-bottom:12px;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 #4d9ef830} 50%{box-shadow:0 0 0 8px transparent} }
.install-text { flex:1; font-size:11px; line-height:1.5; color:var(--blue); }
.install-x { background:none; border:none; color:var(--text3); cursor:pointer; font-size:16px; }

/* ─── UTILS ─── */
.mono { font-family:'JetBrains Mono',monospace; }
.green { color:var(--green); }
.blue  { color:var(--blue);  }
.gold  { color:var(--gold);  }
.red   { color:var(--red);   }
.purple{ color:var(--purple);}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div class="header-logo">💰</div>
    <div>
      <div class="header-title">Табыс</div>
      <div class="header-sub">Ежедневный контроль</div>
    </div>
    <div class="header-date" id="headerDate">—</div>
  </div>
</div>

<!-- BODY -->
<div class="body" id="body"></div>

<!-- TABS -->
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('today')" id="tab-today">
    <span class="tab-icon">📅</span>
    <span class="tab-label">Сегодня</span>
    <div class="tab-dot"></div>
  </button>
  <button class="tab-btn" onclick="switchTab('stats')" id="tab-stats">
    <span class="tab-icon">📊</span>
    <span class="tab-label">Прибыль</span>
    <div class="tab-dot"></div>
  </button>
  <button class="tab-btn" onclick="switchTab('borrowers')" id="tab-borrowers">
    <span class="tab-icon">👥</span>
    <span class="tab-label">Заёмщики</span>
    <div class="tab-dot"></div>
  </button>
</div>

<script>
// ─── DATA LAYER ──────────────────────────────────────────────
const LS_B = 'zt_borrowers_v2';
const LS_P = 'zt_payments_v2';
const LS_INST = 'zt_install_dismissed';

function loadData() {
  try { return JSON.parse(localStorage.getItem(LS_B)) || []; } catch { return []; }
}
function loadPayments() {
  try { return JSON.parse(localStorage.getItem(LS_P)) || {}; } catch { return {}; }
}
function saveData() { localStorage.setItem(LS_B, JSON.stringify(state.borrowers)); }
function savePayments() { localStorage.setItem(LS_P, JSON.stringify(state.payments)); }

// ─── STATE ───────────────────────────────────────────────────
const DEFAULT_BORROWERS = [
  {id:1, name:'Заёмщик 1', loan:500000, daily:21000, lastDay:8000, term:28, startDate: todayStr()},
  {id:2, name:'Заёмщик 2', loan:500000, daily:21000, lastDay:8000, term:28, startDate: todayStr()},
  {id:3, name:'Заёмщик 3', loan:500000, daily:21000, lastDay:8000, term:28, startDate: todayStr()},
  {id:4, name:'Заёмщик 4', loan:500000, daily:21000, lastDay:8000, term:28, startDate: todayStr()},
  {id:5, name:'Заёмщик 5', loan:500000, daily:21000, lastDay:8000, term:28, startDate: todayStr()},
];

let state = {
  tab: 'today',
  selectedDate: todayStr(),
  borrowers: loadData(),
  payments: loadPayments(),
  showAdd: false,
  newB: {name:'', loan:500000, daily:21000, lastDay:8000, term:28},
  installDismissed: !!localStorage.getItem(LS_INST),
};

if (!state.borrowers.length) {
  state.borrowers = DEFAULT_BORROWERS;
  saveData();
}

// ─── HELPERS ────────────────────────────────────────────────
function todayStr() {
  return new Date().toISOString().slice(0,10);
}
function fmt(n) {
  if (!n && n !== 0) return '—';
  return new Intl.NumberFormat('ru-RU').format(Math.round(n)) + ' ₸';
}
function fmtK(n) {
  if (!n && n !== 0) return '—';
  if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(1) + 'М ₸';
  if (Math.abs(n) >= 1000) return Math.round(n/1000) + 'к ₸';
  return n + ' ₸';
}
function dateLabel(d) {
  const dt = new Date(d + 'T12:00:00');
  return dt.toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
}
function monthLabel(mk) {
  const [y,m] = mk.split('-');
  const ms = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  return ms[parseInt(m)-1] + ' ' + y;
}
function getDayNum(b, dateStr) {
  const start = new Date(b.startDate + 'T12:00:00');
  const cur   = new Date(dateStr   + 'T12:00:00');
  return Math.floor((cur - start) / 86400000) + 1;
}
function getExpected(b, dateStr) {
  const d = getDayNum(b, dateStr);
  if (d < 1 || d > b.term) return null;
  return d === b.term ? b.lastDay : b.daily;
}
function profitRatio(b) {
  const total = b.daily * (b.term - 1) + b.lastDay;
  return (total - b.loan) / total;
}
function totalReturn(b) { return b.daily * (b.term - 1) + b.lastDay; }

function dayStats(dateStr) {
  const p = state.payments[dateStr] || {};
  let received = 0, profit = 0;
  state.borrowers.forEach(b => {
    if (p[b.id] !== undefined) {
      received += p[b.id];
      profit   += p[b.id] * profitRatio(b);
    }
  });
  return { received, profit, count: Object.keys(p).length };
}

function monthStats(mk) {
  let received = 0, profit = 0, days = 0;
  Object.entries(state.payments).forEach(([d, p]) => {
    if (!d.startsWith(mk)) return;
    const dayR = Object.values(p).reduce((a,v)=>a+v,0);
    if (dayR > 0) days++;
    received += dayR;
    state.borrowers.forEach(b => {
      if (p[b.id] !== undefined) profit += p[b.id] * profitRatio(b);
    });
  });
  return { received, profit, days };
}

function allMonths() {
  return [...new Set(Object.keys(state.payments).map(d=>d.slice(0,7)))]
    .sort().reverse();
}

function totalStats() {
  let received = 0, profit = 0;
  Object.entries(state.payments).forEach(([d, p]) => {
    state.borrowers.forEach(b => {
      if (p[b.id] !== undefined) {
        received += p[b.id];
        profit   += p[b.id] * profitRatio(b);
      }
    });
  });
  return { received, profit };
}

function activeBorrowersOn(dateStr) {
  return state.borrowers.filter(b => {
    const d = getDayNum(b, dateStr);
    return d >= 1 && d <= b.term;
  });
}

// ─── ACTIONS ────────────────────────────────────────────────
function togglePayment(borrowerId) {
  const d = state.selectedDate;
  const b = state.borrowers.find(x => x.id === borrowerId);
  if (!b) return;
  const expected = getExpected(b, d);
  if (!expected) return;
  if (!state.payments[d]) state.payments[d] = {};
  if (state.payments[d][borrowerId] !== undefined) {
    delete state.payments[d][borrowerId];
    if (!Object.keys(state.payments[d]).length) delete state.payments[d];
  } else {
    state.payments[d][borrowerId] = expected;
  }
  savePayments();
  render();
  // Haptic
  if (navigator.vibrate) navigator.vibrate(20);
}

function addBorrower() {
  const b = state.newB;
  if (!b.name.trim()) return;
  const nb = {
    id: Date.now(),
    name: b.name.trim(),
    loan: Number(b.loan),
    daily: Number(b.daily),
    lastDay: Number(b.lastDay),
    term: Number(b.term),
    startDate: todayStr(),
  };
  state.borrowers.push(nb);
  saveData();
  state.newB = {name:'', loan:500000, daily:21000, lastDay:8000, term:28};
  state.showAdd = false;
  render();
}

function removeBorrower(id) {
  if (!confirm('Удалить заёмщика?')) return;
  state.borrowers = state.borrowers.filter(b => b.id !== id);
  saveData();
  render();
}

function switchTab(t) {
  state.tab = t;
  ['today','stats','borrowers'].forEach(k => {
    document.getElementById('tab-'+k).classList.toggle('active', k===t);
  });
  render();
}

// ─── RENDER ─────────────────────────────────────────────────
function render() {
  const body = document.getElementById('body');
  const today = todayStr();

  // Header date
  document.getElementById('headerDate').textContent = dateLabel(today);

  if (state.tab === 'today') body.innerHTML = renderToday();
  else if (state.tab === 'stats') body.innerHTML = renderStats();
  else body.innerHTML = renderBorrowers();

  // Attach events
  if (state.tab === 'today') attachTodayEvents();
  if (state.tab === 'borrowers') attachBorrowersEvents();
  if (state.showAdd) attachModalEvents();
}

// ── TODAY ─────────────────────────────────────────────────
function renderToday() {
  const d  = state.selectedDate;
  const ds = dayStats(d);
  const active = activeBorrowersOn(d);
  const paid = state.payments[d] || {};
  const paidCount = Object.keys(paid).length;
  const ts = totalStats();

  let html = ``;

  // Install banner
  if (!state.installDismissed && !window.matchMedia('(display-mode: standalone)').matches) {
    html += `<div class="install-banner">
      <span style="font-size:24px">📲</span>
      <div class="install-text"><b>Установи как приложение:</b><br>
      Safari → Поделиться → «На экран Домой»<br>
      Chrome → меню ⋮ → «Добавить на главный экран»</div>
      <button class="install-x" onclick="dismissInstall()">✕</button>
    </div>`;
  }

  // Date
  html += `<div class="date-row">
    <span class="date-lbl">ДАТА:</span>
    <input type="date" id="dateInput" value="${d}"/>
  </div>`;

  // KPIs
  html += `<div class="kpi-grid">
    <div class="kpi green">
      <div class="kpi-val">${fmtK(ds.received)}</div>
      <div class="kpi-lbl">Собрано сегодня</div>
    </div>
    <div class="kpi" style="border-color:#9d7cf820">
      <div class="kpi-val" style="color:var(--purple)">${fmtK(ds.profit)}</div>
      <div class="kpi-lbl">Чистая прибыль</div>
    </div>
    <div class="kpi" style="border-color:#f5c84220">
      <div class="kpi-val" style="color:var(--gold)">${paidCount} <span style="font-size:13px;font-weight:400">/ ${active.length}</span></div>
      <div class="kpi-lbl">Отмечено / Активных</div>
    </div>
    <div class="kpi blue">
      <div class="kpi-val" style="color:var(--blue)">${fmtK(ts.profit)}</div>
      <div class="kpi-lbl">Всего прибыли</div>
    </div>
  </div>`;

  // Section
  html += `<div class="sec-title">Заёмщики — ${dateLabel(d)}</div>`;

  if (!state.borrowers.length) {
    html += `<div class="empty"><div class="empty-icon">💸</div><div class="empty-text">Нет заёмщиков.<br>Добавь на вкладке «Заёмщики»</div></div>`;
  }

  state.borrowers.forEach(b => {
    const dayNum  = getDayNum(b, d);
    const isActive = dayNum >= 1 && dayNum <= b.term;
    const isLast   = dayNum === b.term;
    const isPaid   = paid[b.id] !== undefined;
    const paidAmt  = paid[b.id];
    const expected = getExpected(b, d);

    let dayBadge = '';
    if (isActive) {
      if (isLast) dayBadge = `<span class="b-day last">🏁 ПОСЛЕДНИЙ ДЕНЬ</span>`;
      else dayBadge = `<span class="b-day">день ${dayNum}/${b.term}</span>`;
    } else if (dayNum > b.term) {
      dayBadge = `<span class="b-day done">✅ завершён</span>`;
    } else {
      dayBadge = `<span class="b-day" style="color:var(--text3)">ещё ${1-dayNum} дн.</span>`;
    }

    const rowClass = `b-row${isPaid?' paid':''}${!isActive?' inactive':''}`;
    const onclick  = isActive ? `onclick="togglePayment(${b.id})"` : '';

    html += `<div class="${rowClass}" ${onclick}>
      <div class="chk">${isPaid ? '✓' : ''}</div>
      <div class="b-info">
        <div class="b-name">${b.name}</div>
        <div class="b-meta">${dayBadge}</div>
      </div>
      ${isActive ? `<div class="b-amt">
        <div class="b-amt-val">${fmtK(isPaid ? paidAmt : expected)}</div>
        ${isPaid ? `<div class="b-amt-status">✅ получено</div>` : ''}
      </div>` : ''}
    </div>`;
  });

  // Progress
  if (active.length > 0) {
    const pct = Math.round(paidCount / active.length * 100);
    const pctColor = pct === 100 ? 'var(--green)' : pct > 50 ? 'var(--blue)' : 'var(--gold)';
    html += `<div class="card" style="margin-top:4px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:11px;color:var(--text2);font-weight:600">Прогресс сегодня</span>
        <span style="font-size:13px;font-weight:800;color:${pctColor}">${pct}%</span>
      </div>
      <div class="progress-wrap">
        <div class="progress-fill" style="width:${pct}%;background:${pctColor}"></div>
      </div>
      ${pct===100 ? `<div style="text-align:center;font-size:12px;color:var(--green);margin-top:8px;font-weight:700">🎉 Все платежи собраны!</div>` : ''}
    </div>`;
  }

  return html;
}

// ── STATS ─────────────────────────────────────────────────
function renderStats() {
  const ts = totalStats();
  const months = allMonths();

  let html = `<div class="kpi-grid">
    <div class="kpi green">
      <div class="kpi-val">${fmtK(ts.received)}</div>
      <div class="kpi-lbl">Всего получено</div>
    </div>
    <div class="kpi" style="border-color:#9d7cf820">
      <div class="kpi-val" style="color:var(--purple)">${fmtK(ts.profit)}</div>
      <div class="kpi-lbl">Чистая прибыль</div>
    </div>
  </div>`;

  html += `<div class="sec-title">По месяцам</div>`;

  if (!months.length) {
    html += `<div class="empty"><div class="empty-icon">📊</div><div class="empty-text">Нет данных.<br>Начни отмечать платежи на вкладке «Сегодня»</div></div>`;
  }

  months.forEach(mk => {
    const ms = monthStats(mk);
    const pct = ms.days ? Math.min(100, Math.round(ms.days/30*100)) : 0;
    html += `<div class="month-card">
      <div class="month-name">
        ${monthLabel(mk)}
        <span style="font-size:11px;color:var(--text3);font-weight:400">${ms.days} дн.</span>
      </div>
      <div class="stat-grid">
        <div class="stat-item">
          <div class="stat-val green">${fmtK(ms.received)}</div>
          <div class="stat-lbl">Получено</div>
        </div>
        <div class="stat-item">
          <div class="stat-val" style="color:var(--purple)">${fmtK(ms.profit)}</div>
          <div class="stat-lbl">Прибыль</div>
        </div>
        <div class="stat-item">
          <div class="stat-val" style="color:var(--gold)">${ms.days}</div>
          <div class="stat-lbl">Дней</div>
        </div>
        <div class="stat-item">
          <div class="stat-val" style="color:var(--blue)">${ms.days ? fmtK(Math.round(ms.profit/ms.days)) : '—'}</div>
          <div class="stat-lbl">В день</div>
        </div>
      </div>
      <div class="progress-wrap" style="margin-top:10px">
        <div class="progress-fill" style="width:${pct}%;background:var(--purple)"></div>
      </div>
    </div>`;
  });

  // History
  const allDays = Object.entries(state.payments)
    .filter(([,p]) => Object.keys(p).length > 0)
    .sort(([a],[b]) => b.localeCompare(a));

  if (allDays.length > 0) {
    html += `<div class="sec-title" style="margin-top:16px">История дней</div>`;
    allDays.slice(0,40).forEach(([d, p]) => {
      const rec = Object.values(p).reduce((a,v)=>a+v,0);
      let prof = 0;
      state.borrowers.forEach(b => { if (p[b.id] !== undefined) prof += p[b.id]*profitRatio(b); });
      const cnt = Object.keys(p).length;
      const isToday = d === todayStr();
      html += `<div class="day-row" onclick="goToDay('${d}')">
        <div>
          <div style="font-size:12px;font-weight:600;color:var(--text)">${dateLabel(d)}${isToday?' <span style="color:var(--blue);font-size:9px">СЕГОДНЯ</span>':''}</div>
          <div style="font-size:9px;color:var(--text3);margin-top:2px;font-family:'JetBrains Mono',monospace">✓ ${cnt} заёмщика</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:13px;font-weight:700;color:var(--green)">${fmtK(rec)}</div>
          <div style="font-size:9px;color:var(--purple)">+${fmtK(Math.round(prof))}</div>
        </div>
      </div>`;
    });
  }

  return html;
}

// ── BORROWERS ─────────────────────────────────────────────
function renderBorrowers() {
  const totalLoan = state.borrowers.reduce((a,b) => a + b.loan, 0);
  const today = todayStr();

  let html = `<div class="kpi-grid">
    <div class="kpi blue">
      <div class="kpi-val" style="color:var(--blue)">${state.borrowers.length}</div>
      <div class="kpi-lbl">Всего заёмщиков</div>
    </div>
    <div class="kpi green">
      <div class="kpi-val">${fmtK(totalLoan)}</div>
      <div class="kpi-lbl">Капитал в займах</div>
    </div>
  </div>`;

  html += `<div class="sec-title">Список</div>`;

  state.borrowers.forEach(b => {
    const dayNum   = getDayNum(b, today);
    const isActive = dayNum >= 1 && dayNum <= b.term;
    const ret      = totalReturn(b);
    const profit   = ret - b.loan;
    const collected = Object.entries(state.payments).reduce((acc,[,p]) => acc + (p[b.id]||0), 0);
    const pct = Math.min(100, Math.round(collected / ret * 100));
    const pctColor = pct >= 100 ? 'var(--green)' : 'var(--blue)';

    html += `<div class="b-card">
      <div class="b-card-head">
        <div>
          <div class="b-card-name">${b.name}</div>
          <div class="b-card-status" style="color:${isActive?'var(--green)':'var(--text3)'}">
            ${isActive ? `🟢 Активен · день ${dayNum}/${b.term}` : (dayNum > b.term ? '✅ Завершён' : `⏳ Начало: ${dateLabel(b.startDate)}`)}
          </div>
        </div>
        <button class="b-delete" onclick="removeBorrower(${b.id})">✕</button>
      </div>
      <div class="b-stats">
        <div class="bs">
          <div class="bs-val" style="color:var(--blue)">${fmtK(b.loan)}</div>
          <div class="bs-lbl">Займ</div>
        </div>
        <div class="bs">
          <div class="bs-val" style="color:var(--green)">${fmtK(ret)}</div>
          <div class="bs-lbl">Возврат</div>
        </div>
        <div class="bs">
          <div class="bs-val" style="color:var(--purple)">${fmtK(profit)}</div>
          <div class="bs-lbl">Прибыль</div>
        </div>
        <div class="bs">
          <div class="bs-val" style="color:var(--gold)">${fmtK(b.daily)}</div>
          <div class="bs-lbl">В день</div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
        <span style="font-size:9px;color:var(--text3)">Собрано: ${fmt(collected)}</span>
        <span style="font-size:10px;font-weight:700;color:${pctColor}">${pct}%</span>
      </div>
      <div class="progress-wrap">
        <div class="progress-fill" style="width:${pct}%;background:${pctColor}"></div>
      </div>
      <div style="font-size:9px;color:var(--text3);margin-top:8px;font-family:'JetBrains Mono',monospace">
        Начало: ${b.startDate} · Срок: ${b.term} дн.
      </div>
    </div>`;
  });

  html += `<button class="add-btn" onclick="openAdd()">+ Добавить заёмщика</button>`;

  // Modal
  if (state.showAdd) {
    const nb = state.newB;
    const previewTotal = Number(nb.daily)*(Number(nb.term)-1) + Number(nb.lastDay);
    const previewProfit = previewTotal - Number(nb.loan);
    html += `<div class="modal-overlay" onclick="closeAdd(event)">
      <div class="modal-card">
        <div class="modal-title">➕ Новый заёмщик</div>
        <div class="form-group">
          <label>Имя заёмщика</label>
          <input type="text" id="nb-name" value="${nb.name}" placeholder="Например: Ляззат" oninput="updateNew('name',this.value)"/>
        </div>
        <div class="form-row">
          <div>
            <label>Сумма займа (₸)</label>
            <input type="number" id="nb-loan" value="${nb.loan}" oninput="updateNew('loan',this.value)"/>
          </div>
          <div>
            <label>Срок (дней)</label>
            <input type="number" id="nb-term" value="${nb.term}" oninput="updateNew('term',this.value)"/>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label>Платёж в день (₸)</label>
            <input type="number" id="nb-daily" value="${nb.daily}" oninput="updateNew('daily',this.value)"/>
          </div>
          <div>
            <label>Последний день (₸)</label>
            <input type="number" id="nb-last" value="${nb.lastDay}" oninput="updateNew('lastDay',this.value)"/>
          </div>
        </div>
        <div class="preview-box">
          <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-family:'JetBrains Mono',monospace">Предпросмотр</div>
          <div class="preview-row">
            <span class="preview-lbl">Итого получу:</span>
            <span class="preview-val green">${fmt(previewTotal)}</span>
          </div>
          <div class="preview-row">
            <span class="preview-lbl">Чистая прибыль:</span>
            <span class="preview-val" style="color:var(--purple)">${fmt(previewProfit)}</span>
          </div>
          <div class="preview-row">
            <span class="preview-lbl">% доходности:</span>
            <span class="preview-val" style="color:var(--gold)">${nb.loan ? Math.round(previewProfit/Number(nb.loan)*100) : 0}%</span>
          </div>
        </div>
        <div class="btn-row">
          <button class="btn-cancel" onclick="closeAdd()">Отмена</button>
          <button class="btn-save" onclick="addBorrower()" ${!nb.name.trim()?'disabled':''}>Сохранить</button>
        </div>
      </div>
    </div>`;
  }

  return html;
}

// ─── EVENT ATTACHERS ─────────────────────────────────────
function attachTodayEvents() {
  const inp = document.getElementById('dateInput');
  if (inp) inp.addEventListener('change', e => {
    state.selectedDate = e.target.value;
    render();
  });
}
function attachBorrowersEvents() {}
function attachModalEvents() {}

function goToDay(d) {
  state.selectedDate = d;
  switchTab('today');
}
function openAdd() { state.showAdd = true; render(); }
function closeAdd(e) {
  if (e && e.target !== e.currentTarget) return;
  state.showAdd = false; render();
}
function updateNew(key, val) {
  state.newB[key] = val;
  // re-render preview only
  const nb = state.newB;
  const previewTotal = Number(nb.daily)*(Number(nb.term)-1) + Number(nb.lastDay);
  const previewProfit = previewTotal - Number(nb.loan);
  const pvs = document.querySelectorAll('.preview-val');
  if (pvs[0]) pvs[0].textContent = fmt(previewTotal);
  if (pvs[1]) pvs[1].textContent = fmt(previewProfit);
  if (pvs[2]) pvs[2].textContent = (nb.loan ? Math.round(previewProfit/Number(nb.loan)*100) : 0) + '%';
  const saveBtn = document.querySelector('.btn-save');
  if (saveBtn) saveBtn.disabled = !String(nb.name).trim();
}
function dismissInstall() {
  state.installDismissed = true;
  localStorage.setItem(LS_INST, '1');
  render();
}

// ─── INIT ────────────────────────────────────────────────
render();

// Service Worker for offline
if ('serviceWorker' in navigator) {
  const sw = `
    const CACHE = 'zt-v1';
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./', location.href])));
      self.skipWaiting();
    });
    self.addEventListener('fetch', e => {
      e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
    });
  `;
  const blob = new Blob([sw], {type:'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}
</script>
</body>
</html>
