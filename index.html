<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Займ"/>
<meta name="theme-color" content="#070c18"/>
<title>Займ Трекер</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Rubik:wght@400;500;700;900&display=swap');

:root {
  --bg:#070c18; --bg2:#0d1525; --bg3:#111e35; --bg4:#162240;
  --border:#1a2d4a; --border2:#243d5e;
  --text:#dde6f0; --text2:#8ba5c4; --text3:#4d6a85;
  --green:#10e87a; --green2:#0ab55e; --green-bg:#071a0f;
  --blue:#4d9ef8; --blue2:#2d7de8; --blue-bg:#071325;
  --purple:#9d7cf8; --purple-bg:#110c25;
  --gold:#f5c842; --gold-bg:#1a1505;
  --red:#f85454; --red-bg:#200808;
  --orange:#ff8c42; --orange-bg:#1a0c05;
  --radius:14px; --tab-h:64px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Rubik',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}

/* ─ HEADER ─ */
.hdr{position:fixed;top:0;left:0;right:0;z-index:50;
  background:linear-gradient(180deg,#070c18,#0a1020);
  border-bottom:1px solid var(--border);
  padding:env(safe-area-inset-top,0) 0 0}
.hdr-in{display:flex;align-items:center;gap:10px;padding:13px 16px 11px}
.logo{width:38px;height:38px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,#1d4ed8,#3b82f6);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 0 16px #2563eb40}
.app-title{font-size:16px;font-weight:700;letter-spacing:-.5px}
.app-sub{font-size:9px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;
  margin-top:1px;font-family:'JetBrains Mono',monospace}
.hdr-day{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;
  color:var(--blue);font-weight:600;background:var(--blue-bg);
  border:1px solid var(--border2);padding:5px 10px;border-radius:20px;
  white-space:nowrap}
/* Monday badge */
.mon-badge{background:var(--red-bg);border:1px solid var(--red);color:var(--red);
  font-size:9px;font-weight:700;padding:3px 8px;border-radius:12px;margin-left:6px;
  font-family:'JetBrains Mono',monospace}

/* ─ TABS ─ */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:var(--bg2);border-top:1px solid var(--border);
  display:grid;grid-template-columns:1fr 1fr 1fr;
  padding:0 0 env(safe-area-inset-bottom,0);
  height:calc(var(--tab-h) + env(safe-area-inset-bottom,0))}
.tab-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:none;background:transparent;cursor:pointer;
  color:var(--text3);transition:color .2s;padding:8px 0}
.tab-btn.active{color:var(--blue)}
.tab-icon{font-size:21px;line-height:1}
.tab-label{font-size:9px;font-weight:600;letter-spacing:.5px;
  text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.tab-dot{width:4px;height:4px;border-radius:50%;background:var(--blue);
  margin-top:1px;opacity:0;transition:opacity .2s}
.tab-btn.active .tab-dot{opacity:1}

/* ─ BODY ─ */
.body{padding:calc(80px + 8px) 15px calc(var(--tab-h) + 16px);
  max-width:480px;margin:0 auto}

/* ─ KPI GRID ─ */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{background:var(--bg2);border:1px solid var(--border);
  border-radius:12px;padding:11px 13px;position:relative;overflow:hidden}
.kpi-val{font-size:18px;font-weight:800;letter-spacing:-.5px}
.kpi-val.green{color:var(--green)}
.kpi-val.blue{color:var(--blue)}
.kpi-val.purple{color:var(--purple)}
.kpi-val.gold{color:var(--gold)}
.kpi-lbl{font-size:8px;color:var(--text3);text-transform:uppercase;
  letter-spacing:1px;margin-top:3px;font-family:'JetBrains Mono',monospace}

/* ─ DATE ROW ─ */
.date-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.date-lbl{font-size:9px;color:var(--text3);font-family:'JetBrains Mono',monospace;white-space:nowrap}
input[type=date]{flex:1;background:var(--bg3);border:1px solid var(--border2);
  color:var(--text);padding:8px 11px;border-radius:10px;
  font-size:12px;font-family:'Rubik',sans-serif;outline:none;-webkit-appearance:none}
input[type=date]:focus{border-color:var(--blue)}

/* ─ MONDAY BANNER ─ */
.mon-banner{background:var(--red-bg);border:1px solid var(--red)40;
  border-radius:12px;padding:12px 14px;margin-bottom:10px;
  display:flex;align-items:center;gap:10px}
.mon-banner-icon{font-size:28px}
.mon-banner-text{font-size:12px;color:var(--red);font-weight:600;line-height:1.4}
.mon-banner-sub{font-size:10px;color:var(--text3);margin-top:2px}

/* ─ SEC TITLE ─ */
.sec{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:2px;
  margin-bottom:8px;font-family:'JetBrains Mono',monospace;
  display:flex;align-items:center;gap:6px}
.sec::after{content:'';flex:1;height:1px;background:var(--border)}

/* ─ BORROWER ROW ─ */
.br{display:flex;align-items:center;gap:10px;padding:11px 12px;
  background:var(--bg2);border:1px solid var(--border);
  border-radius:12px;margin-bottom:6px;transition:all .15s;cursor:pointer;
  -webkit-user-select:none;user-select:none}
.br.paid{background:var(--green-bg);border-color:#10e87a28;
  box-shadow:0 0 10px #10e87a0a}
.br.inactive{opacity:.35;cursor:default}
.br.monday{opacity:.5;cursor:default;border-style:dashed}
.chk{width:26px;height:26px;border-radius:8px;flex-shrink:0;
  border:2px solid var(--border2);background:var(--bg3);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;transition:all .15s;color:transparent}
.br.paid .chk{background:var(--green2);border-color:var(--green2);
  color:#fff;box-shadow:0 0 10px #10e87a50}
.br.monday .chk{border-style:dashed;border-color:var(--red)}

.bi{flex:1;min-width:0}
.bn{font-size:13px;font-weight:600;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm{display:flex;align-items:center;gap:5px;margin-top:2px;flex-wrap:wrap}
.badge{font-size:8px;color:var(--text3);font-family:'JetBrains Mono',monospace;
  background:var(--bg3);padding:2px 6px;border-radius:4px}
.badge.last{color:var(--gold);background:var(--gold-bg)}
.badge.done{color:var(--green);background:var(--green-bg)}
.badge.mon{color:var(--red);background:var(--red-bg)}

.bamt{text-align:right;flex-shrink:0}
.bamt-v{font-size:13px;font-weight:700;color:var(--green);font-family:'JetBrains Mono',monospace}
.bamt-s{font-size:8px;color:var(--green2);margin-top:1px}

/* ─ PROGRESS ─ */
.prog-wrap{height:5px;background:var(--bg3);border-radius:99px;overflow:hidden;margin-top:5px}
.prog-fill{height:100%;border-radius:99px;transition:width .4s}

/* ─ CARD ─ */
.card{background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:13px;margin-bottom:10px}

/* ─ MONTH CARD ─ */
.mc{background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:13px;margin-bottom:8px}
.mc-title{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:9px;
  display:flex;justify-content:space-between;align-items:center}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.si{background:var(--bg3);border-radius:8px;padding:8px 10px}
.sv{font-size:13px;font-weight:700}
.sl{font-size:7px;color:var(--text3);text-transform:uppercase;
  letter-spacing:1px;margin-top:2px;font-family:'JetBrains Mono',monospace}

/* ─ DAY ROW ─ */
.dr{display:flex;align-items:center;justify-content:space-between;
  padding:9px 12px;background:var(--bg2);border:1px solid var(--border);
  border-radius:10px;margin-bottom:5px;cursor:pointer;transition:border-color .15s}
.dr:active{border-color:var(--blue)}

/* ─ BORROWER CARD ─ */
.bc{background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:13px;margin-bottom:9px}
.bc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px}
.bc-name{font-size:14px;font-weight:700}
.bc-status{font-size:10px;margin-top:2px}
.bc-del{background:none;border:none;color:var(--red);cursor:pointer;
  font-size:18px;padding:0 4px;line-height:1}
.bc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:9px}
.bs{background:var(--bg3);border-radius:8px;padding:7px 4px;text-align:center}
.bsv{font-size:11px;font-weight:700}
.bsl{font-size:7px;color:var(--text3);text-transform:uppercase;margin-top:2px;
  font-family:'JetBrains Mono',monospace}

/* ─ ADD BTN ─ */
.add-btn{width:100%;background:linear-gradient(135deg,#1d4ed8,#3b82f6);
  color:#fff;border:none;border-radius:12px;padding:13px;
  font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.5px;
  font-family:'Rubik',sans-serif;box-shadow:0 4px 20px #2563eb30;
  transition:transform .15s;margin-top:4px}
.add-btn:active{transform:scale(.98)}

/* ─ MODAL ─ */
.overlay{position:fixed;inset:0;background:#000000a0;
  display:flex;align-items:flex-end;z-index:200;backdrop-filter:blur(4px);
  animation:fi .2s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg2);border-radius:20px 20px 0 0;
  padding:20px;width:100%;
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0));
  animation:su .22s cubic-bezier(.4,0,.2,1);
  max-height:92dvh;overflow-y:auto;border-top:1px solid var(--border2)}
@keyframes su{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-title{font-size:15px;font-weight:700;margin-bottom:16px}
.fg{margin-bottom:10px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
label{font-size:9px;color:var(--text3);display:block;margin-bottom:5px;
  text-transform:uppercase;letter-spacing:1px;font-family:'JetBrains Mono',monospace}
input[type=text],input[type=number]{
  width:100%;background:var(--bg3);border:1px solid var(--border2);
  color:var(--text);padding:10px 12px;border-radius:10px;
  font-size:13px;font-family:'Rubik',sans-serif;outline:none;box-sizing:border-box}
input:focus{border-color:var(--blue)}
.prev{background:var(--bg3);border:1px solid var(--border);
  border-radius:10px;padding:11px;margin-bottom:13px}
.prev-row{display:flex;justify-content:space-between;padding:3px 0}
.prev-lbl{font-size:10px;color:var(--text3)}
.prev-val{font-size:11px;font-weight:700}
.btn-row{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.btn-c{background:var(--bg3);color:var(--text2);border:1px solid var(--border2);
  border-radius:10px;padding:12px;font-size:12px;font-weight:700;
  cursor:pointer;font-family:'Rubik',sans-serif}
.btn-s{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;
  border:none;border-radius:10px;padding:12px;font-size:12px;
  font-weight:700;cursor:pointer;font-family:'Rubik',sans-serif}
.btn-s:disabled{opacity:.4;cursor:not-allowed}

/* ─ SCHEDULE INFO ─ */
.sched-box{background:var(--orange-bg);border:1px solid var(--orange)30;
  border-radius:10px;padding:10px 12px;margin-bottom:12px}
.sched-title{font-size:9px;color:var(--orange);text-transform:uppercase;
  letter-spacing:1px;font-family:'JetBrains Mono',monospace;margin-bottom:5px}
.day-pills{display:flex;gap:4px;flex-wrap:wrap}
.pill{padding:3px 8px;border-radius:99px;font-size:9px;font-weight:700;
  font-family:'JetBrains Mono',monospace}
.pill.on{background:var(--green-bg);color:var(--green);border:1px solid var(--green)30}
.pill.off{background:var(--red-bg);color:var(--red);border:1px solid var(--red)30}

.empty{text-align:center;padding:50px 20px;color:var(--text3)}
.empty-icon{font-size:44px;margin-bottom:12px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-in">
    <div class="logo">💰</div>
    <div>
      <div class="app-title">Займ Трекер</div>
      <div class="app-sub">Ежедневный контроль</div>
    </div>
    <div id="hdrDate" class="hdr-day">—</div>
  </div>
</div>

<div class="body" id="body"></div>

<div class="tabs">
  <button class="tab-btn active" onclick="go('today')" id="tab-today">
    <span class="tab-icon">📅</span>
    <span class="tab-label">Сегодня</span>
    <div class="tab-dot"></div>
  </button>
  <button class="tab-btn" onclick="go('stats')" id="tab-stats">
    <span class="tab-icon">📊</span>
    <span class="tab-label">Прибыль</span>
    <div class="tab-dot"></div>
  </button>
  <button class="tab-btn" onclick="go('borrow')" id="tab-borrow">
    <span class="tab-icon">👥</span>
    <span class="tab-label">Заёмщики</span>
    <div class="tab-dot"></div>
  </button>
</div>

<script>
// ─── STORAGE ─────────────────────────────────────────────────
const LB='zt3_borrowers', LP='zt3_payments';
function ldb(){ try{return JSON.parse(localStorage.getItem(LB))||[]}catch{return[]} }
function ldp(){ try{return JSON.parse(localStorage.getItem(LP))||{}}catch{return{}} }
function svb(){ localStorage.setItem(LB, JSON.stringify(S.borrowers)) }
function svp(){ localStorage.setItem(LP, JSON.stringify(S.payments)) }

// ─── HELPERS ─────────────────────────────────────────────────
function todayStr(){ return new Date().toISOString().slice(0,10) }
function fmt(n){ if(!n&&n!==0)return'—'; return new Intl.NumberFormat('ru-RU').format(Math.round(n))+' ₸' }
function fmtK(n){
  if(!n&&n!==0)return'—';
  if(Math.abs(n)>=1e6)return(n/1e6).toFixed(1)+'М ₸';
  if(Math.abs(n)>=1000)return Math.round(n/1000)+'к ₸';
  return n+' ₸';
}
function dateLabel(d){
  const dt=new Date(d+'T12:00:00');
  return dt.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
}
function dayOfWeek(d){
  // 0=Sun,1=Mon,2=Tue,3=Wed,4=Thu,5=Fri,6=Sat
  return new Date(d+'T12:00:00').getDay();
}
function isMonday(d){ return dayOfWeek(d)===1 }
function dayName(d){
  const days=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  return days[dayOfWeek(d)];
}
function monthLabel(mk){
  const [y,m]=mk.split('-');
  const ms=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  return ms[parseInt(m)-1]+' '+y;
}
// Day number counting only working days (skip Mondays)
function getWorkDayNum(b, dateStr){
  const start=new Date(b.startDate+'T12:00:00');
  const cur=new Date(dateStr+'T12:00:00');
  if(cur<start) return 0;
  let count=0;
  const d=new Date(start);
  while(d<=cur){
    if(d.getDay()!==1) count++; // skip Monday
    d.setDate(d.getDate()+1);
  }
  return count;
}
function totalReturn(b){ return b.daily*(b.term-1)+b.lastDay }
function profitRatio(b){
  const t=totalReturn(b);
  return (t-b.loan)/t;
}
// Calendar day of a given work-day index for a borrower
function workDayToDate(b, workDayIdx){
  const start=new Date(b.startDate+'T12:00:00');
  let count=0;
  const d=new Date(start);
  while(true){
    if(d.getDay()!==1){
      count++;
      if(count===workDayIdx) return d.toISOString().slice(0,10);
    }
    d.setDate(d.getDate()+1);
    if(count>500) break;
  }
  return null;
}
// End date (last payment date)
function endDate(b){
  return workDayToDate(b, b.term);
}
// Expected payment on a given date
function getExpected(b, dateStr){
  if(isMonday(dateStr)) return null; // no collection on Monday
  const wdNum=getWorkDayNum(b, dateStr);
  if(wdNum<1||wdNum>b.term) return null;
  return wdNum===b.term ? b.lastDay : b.daily;
}
function isActiveOn(b, dateStr){
  if(isMonday(dateStr)) return false;
  const wdNum=getWorkDayNum(b, dateStr);
  return wdNum>=1 && wdNum<=b.term;
}

// ─── STATE ───────────────────────────────────────────────────
const DEFAULT = [
  {id:1,name:'Заёмщик 1',loan:500000,daily:21000,lastDay:8000,term:28,startDate:todayStr()},
  {id:2,name:'Заёмщик 2',loan:500000,daily:21000,lastDay:8000,term:28,startDate:todayStr()},
  {id:3,name:'Заёмщик 3',loan:500000,daily:21000,lastDay:8000,term:28,startDate:todayStr()},
];
const S={
  tab:'today',
  sel: todayStr(),
  borrowers: ldb(),
  payments: ldp(),
  showAdd: false,
  nb:{name:'',loan:500000,daily:21000,lastDay:8000,term:28},
};
if(!S.borrowers.length){ S.borrowers=DEFAULT; svb(); }

// ─── ACTIONS ─────────────────────────────────────────────────
function toggle(bid){
  const d=S.sel;
  if(isMonday(d)) return;
  const b=S.borrowers.find(x=>x.id===bid);
  if(!b) return;
  const exp=getExpected(b,d);
  if(!exp) return;
  if(!S.payments[d]) S.payments[d]={};
  if(S.payments[d][bid]!==undefined) delete S.payments[d][bid];
  else S.payments[d][bid]=exp;
  if(!Object.keys(S.payments[d]).length) delete S.payments[d];
  svp(); render();
  if(navigator.vibrate) navigator.vibrate(20);
}

function addBorrower(){
  const nb=S.nb;
  if(!nb.name.trim()) return;
  S.borrowers.push({
    id:Date.now(),
    name:nb.name.trim(),
    loan:Number(nb.loan),
    daily:Number(nb.daily),
    lastDay:Number(nb.lastDay),
    term:Number(nb.term),
    startDate:todayStr(),
  });
  svb();
  S.nb={name:'',loan:500000,daily:21000,lastDay:8000,term:28};
  S.showAdd=false;
  render();
}

function del(id){
  if(!confirm('Удалить заёмщика?')) return;
  S.borrowers=S.borrowers.filter(b=>b.id!==id);
  svb(); render();
}

function go(t){
  S.tab=t;
  ['today','stats','borrow'].forEach(k=>{
    document.getElementById('tab-'+k).classList.toggle('active',k===t);
  });
  render();
}

function goDay(d){ S.sel=d; go('today'); }

// ─── STATS HELPERS ───────────────────────────────────────────
function dayStats(d){
  const p=S.payments[d]||{};
  let rec=0,prof=0;
  S.borrowers.forEach(b=>{
    if(p[b.id]!==undefined){ rec+=p[b.id]; prof+=p[b.id]*profitRatio(b); }
  });
  return{rec,prof,cnt:Object.keys(p).length};
}
function monthStats(mk){
  let rec=0,prof=0,days=0;
  Object.entries(S.payments).forEach(([d,p])=>{
    if(!d.startsWith(mk)) return;
    const r=Object.values(p).reduce((a,v)=>a+v,0);
    if(r>0) days++;
    rec+=r;
    S.borrowers.forEach(b=>{ if(p[b.id]!==undefined) prof+=p[b.id]*profitRatio(b); });
  });
  return{rec,prof,days};
}
function allMonths(){
  return[...new Set(Object.keys(S.payments).map(d=>d.slice(0,7)))].sort().reverse();
}
function totalStats(){
  let rec=0,prof=0;
  Object.values(S.payments).forEach(p=>{
    S.borrowers.forEach(b=>{ if(p[b.id]!==undefined){rec+=p[b.id];prof+=p[b.id]*profitRatio(b);} });
  });
  return{rec,prof};
}

// ─── RENDER ──────────────────────────────────────────────────
function render(){
  const today=todayStr();
  const isMon=isMonday(S.sel);
  document.getElementById('hdrDate').innerHTML=
    dayName(S.sel)+', '+dateLabel(S.sel)+
    (isMon?'<span class="mon-badge">ВЫХОДНОЙ</span>':'');

  const b=document.getElementById('body');
  if(S.tab==='today') b.innerHTML=rToday();
  else if(S.tab==='stats') b.innerHTML=rStats();
  else b.innerHTML=rBorrow();

  // date input listener
  const di=document.getElementById('di');
  if(di) di.addEventListener('change',e=>{S.sel=e.target.value;render();});
}

// ── TODAY ─────────────────────────────────────────────────────
function rToday(){
  const d=S.sel, isMon=isMonday(d);
  const ds=dayStats(d);
  const active=S.borrowers.filter(b=>isActiveOn(b,d));
  const paid=S.payments[d]||{};
  const paidCnt=Object.keys(paid).length;
  const ts=totalStats();

  let h='';

  // Date picker
  h+=`<div class="date-row">
    <span class="date-lbl">ДАТА:</span>
    <input type="date" id="di" value="${d}"/>
  </div>`;

  // Monday banner
  if(isMon){
    h+=`<div class="mon-banner">
      <div class="mon-banner-icon">🛌</div>
      <div>
        <div class="mon-banner-text">Понедельник — выходной</div>
        <div class="mon-banner-sub">Сбор платежей не производится</div>
      </div>
    </div>`;
  }

  // KPI
  h+=`<div class="kpi-grid">
    <div class="kpi"><div class="kpi-val green">${fmtK(ds.rec)}</div><div class="kpi-lbl">Собрано сегодня</div></div>
    <div class="kpi"><div class="kpi-val purple">${fmtK(ds.prof)}</div><div class="kpi-lbl">Прибыль сегодня</div></div>
    <div class="kpi"><div class="kpi-val gold">${paidCnt}<span style="font-size:12px;font-weight:400"> / ${active.length}</span></div><div class="kpi-lbl">Отмечено / Активных</div></div>
    <div class="kpi"><div class="kpi-val blue">${fmtK(ts.prof)}</div><div class="kpi-lbl">Всего прибыли</div></div>
  </div>`;

  // Schedule pills
  const days=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  const work=[0,2,3,4,5,6]; // not Monday(1)
  const dow=dayOfWeek(d);
  h+=`<div class="sched-box">
    <div class="sched-title">График сбора (6 дней в неделю)</div>
    <div class="day-pills">
      ${days.map((n,i)=>`<span class="pill ${i===1?'off':'on'}">${n}${i===dow?' ◀':''}</span>`).join('')}
    </div>
  </div>`;

  h+=`<div class="sec">Заёмщики — ${dateLabel(d)}</div>`;

  if(!S.borrowers.length){
    h+=`<div class="empty"><div class="empty-icon">💸</div><div>Добавь заёмщиков на вкладке «Заёмщики»</div></div>`;
  }

  S.borrowers.forEach(b=>{
    const wdNum=getWorkDayNum(b,d);
    const active2=!isMon && wdNum>=1 && wdNum<=b.term;
    const isLast=wdNum===b.term;
    const isPaid=paid[b.id]!==undefined;
    const paidAmt=paid[b.id];
    const exp=getExpected(b,d);
    const done=wdNum>b.term;

    let badge='';
    if(isMon) badge=`<span class="badge mon">пн — выходной</span>`;
    else if(active2){
      badge=isLast
        ?`<span class="badge last">🏁 ПОСЛЕДНИЙ ДЕНЬ</span>`
        :`<span class="badge">день ${wdNum}/${b.term}</span>`;
    } else if(done) badge=`<span class="badge done">✅ завершён</span>`;
    else badge=`<span class="badge">ждём начала</span>`;

    const cls=`br${isPaid?' paid':''}${(!active2&&!done)||isMon?' inactive':''}${isMon?' monday':''}`;
    const click=active2&&!isMon?`onclick="toggle(${b.id})"`:'';

    h+=`<div class="${cls}" ${click}>
      <div class="chk">${isPaid?'✓':''}</div>
      <div class="bi">
        <div class="bn">${b.name}</div>
        <div class="bm">${badge}</div>
      </div>
      ${active2?`<div class="bamt">
        <div class="bamt-v">${fmtK(isPaid?paidAmt:exp)}</div>
        ${isPaid?`<div class="bamt-s">✅ получено</div>`:''}
      </div>`:''}
    </div>`;
  });

  // Progress
  if(active.length>0&&!isMon){
    const pct=Math.round(paidCnt/active.length*100);
    const col=pct===100?'var(--green)':pct>60?'var(--blue)':'var(--gold)';
    h+=`<div class="card" style="margin-top:4px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
        <span style="font-size:11px;color:var(--text2);font-weight:600">Прогресс сегодня</span>
        <span style="font-size:14px;font-weight:800;color:${col}">${pct}%</span>
      </div>
      <div class="prog-wrap"><div class="prog-fill" style="width:${pct}%;background:${col}"></div></div>
      ${pct===100?`<div style="text-align:center;font-size:12px;color:var(--green);margin-top:8px;font-weight:700">🎉 Все платежи собраны!</div>`:''}
    </div>`;
  }
  return h;
}

// ── STATS ─────────────────────────────────────────────────────
function rStats(){
  const ts=totalStats();
  const months=allMonths();
  let h=`<div class="kpi-grid">
    <div class="kpi"><div class="kpi-val green">${fmtK(ts.rec)}</div><div class="kpi-lbl">Всего получено</div></div>
    <div class="kpi"><div class="kpi-val purple">${fmtK(ts.prof)}</div><div class="kpi-lbl">Чистая прибыль</div></div>
  </div>`;

  h+=`<div class="sec">По месяцам</div>`;

  if(!months.length){
    h+=`<div class="empty"><div class="empty-icon">📊</div><div>Нет данных — начни отмечать платежи</div></div>`;
  }

  months.forEach(mk=>{
    const ms=monthStats(mk);
    const pct=ms.days?Math.min(100,Math.round(ms.days/26*100)):0;
    h+=`<div class="mc">
      <div class="mc-title">${monthLabel(mk)}<span style="font-size:10px;color:var(--text3);font-weight:400">${ms.days} дн.</span></div>
      <div class="sg">
        <div class="si"><div class="sv green">${fmtK(ms.rec)}</div><div class="sl">Получено</div></div>
        <div class="si"><div class="sv purple">${fmtK(ms.prof)}</div><div class="sl">Прибыль</div></div>
        <div class="si"><div class="sv gold">${ms.days}</div><div class="sl">Рабочих дней</div></div>
        <div class="si"><div class="sv blue">${ms.days?fmtK(Math.round(ms.prof/ms.days)):'—'}</div><div class="sl">В день</div></div>
      </div>
      <div class="prog-wrap" style="margin-top:9px">
        <div class="prog-fill" style="width:${pct}%;background:var(--purple)"></div>
      </div>
    </div>`;
  });

  // History
  const allDays=Object.entries(S.payments)
    .filter(([,p])=>Object.keys(p).length>0)
    .sort(([a],[b])=>b.localeCompare(a));

  if(allDays.length){
    h+=`<div class="sec" style="margin-top:14px">История дней</div>`;
    allDays.slice(0,40).forEach(([d,p])=>{
      const rec=Object.values(p).reduce((a,v)=>a+v,0);
      let prof=0;
      S.borrowers.forEach(b=>{if(p[b.id]!==undefined) prof+=p[b.id]*profitRatio(b);});
      const cnt=Object.keys(p).length;
      const isTod=d===todayStr();
      h+=`<div class="dr" onclick="goDay('${d}')">
        <div>
          <div style="font-size:12px;font-weight:600">${dayName(d)}, ${dateLabel(d)}${isTod?' <span style="color:var(--blue);font-size:9px">СЕГОДНЯ</span>':''}</div>
          <div style="font-size:9px;color:var(--text3);margin-top:1px;font-family:\'JetBrains Mono\',monospace">✓ ${cnt} заёмщика</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:13px;font-weight:700;color:var(--green)">${fmtK(rec)}</div>
          <div style="font-size:9px;color:var(--purple)">+${fmtK(Math.round(prof))}</div>
        </div>
      </div>`;
    });
  }
  return h;
}

// ── BORROWERS ─────────────────────────────────────────────────
function rBorrow(){
  const today=todayStr();
  const totLoan=S.borrowers.reduce((a,b)=>a+b.loan,0);

  let h=`<div class="kpi-grid">
    <div class="kpi"><div class="kpi-val blue">${S.borrowers.length}</div><div class="kpi-lbl">Всего заёмщиков</div></div>
    <div class="kpi"><div class="kpi-val green">${fmtK(totLoan)}</div><div class="kpi-lbl">Капитал в займах</div></div>
  </div>`;

  h+=`<div class="sec">Список</div>`;

  S.borrowers.forEach(b=>{
    const wdNum=getWorkDayNum(b,today);
    const active=wdNum>=1&&wdNum<=b.term;
    const ret=totalReturn(b);
    const profit=ret-b.loan;
    const coll=Object.entries(S.payments).reduce((acc,[,p])=>acc+(p[b.id]||0),0);
    const pct=Math.min(100,Math.round(coll/ret*100));
    const col=pct>=100?'var(--green)':'var(--blue)';
    const ed=endDate(b)||'—';

    h+=`<div class="bc">
      <div class="bc-head">
        <div>
          <div class="bc-name">${b.name}</div>
          <div class="bc-status" style="color:${active?'var(--green)':'var(--text3)'}">
            ${active?`🟢 День ${wdNum}/${b.term}`:(wdNum>b.term?'✅ Завершён':'⏳ Ожидает')}
          </div>
        </div>
        <button class="bc-del" onclick="del(${b.id})">✕</button>
      </div>
      <div class="bc-stats">
        <div class="bs"><div class="bsv blue">${fmtK(b.loan)}</div><div class="bsl">Займ</div></div>
        <div class="bs"><div class="bsv green">${fmtK(ret)}</div><div class="bsl">Возврат</div></div>
        <div class="bs"><div class="bsv purple">${fmtK(profit)}</div><div class="bsl">Прибыль</div></div>
        <div class="bs"><div class="bsv gold">${fmtK(b.daily)}</div><div class="bsl">В день</div></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
        <span style="font-size:9px;color:var(--text3)">Собрано: ${fmt(coll)}</span>
        <span style="font-size:10px;font-weight:700;color:${col}">${pct}%</span>
      </div>
      <div class="prog-wrap">
        <div class="prog-fill" style="width:${pct}%;background:${col}"></div>
      </div>
      <div style="font-size:8px;color:var(--text3);margin-top:7px;font-family:'JetBrains Mono',monospace">
        Начало: ${b.startDate} · Срок: ${b.term} раб.дней · Конец: ${ed}
      </div>
    </div>`;
  });

  h+=`<button class="add-btn" onclick="openAdd()">+ Добавить заёмщика</button>`;

  if(S.showAdd){
    const nb=S.nb;
    const prevTotal=Number(nb.daily)*(Number(nb.term)-1)+Number(nb.lastDay);
    const prevProfit=prevTotal-Number(nb.loan);
    // Approximate end date (term working days from today)
    h+=`<div class="overlay" onclick="closeAdd(event)">
      <div class="modal">
        <div class="modal-title">➕ Новый заёмщик</div>
        <div class="fg">
          <label>Имя заёмщика</label>
          <input type="text" id="nb-name" value="${nb.name}" placeholder="Например: Ляззат" oninput="un('name',this.value)"/>
        </div>
        <div class="fg2">
          <div><label>Сумма займа (₸)</label><input type="number" value="${nb.loan}" oninput="un('loan',this.value)"/></div>
          <div>
            <label>Срок (рабочих дней)</label>
            <input type="number" value="${nb.term}" oninput="un('term',this.value)" placeholder="28"/>
          </div>
        </div>
        <div class="fg2">
          <div><label>Платёж / день (₸)</label><input type="number" value="${nb.daily}" oninput="un('daily',this.value)"/></div>
          <div><label>Последний день (₸)</label><input type="number" value="${nb.lastDay}" oninput="un('lastDay',this.value)"/></div>
        </div>
        <div style="background:var(--orange-bg);border:1px solid var(--orange)30;border-radius:8px;padding:9px 11px;margin-bottom:10px">
          <div style="font-size:9px;color:var(--orange);font-family:'JetBrains Mono',monospace;margin-bottom:3px">⚠ ПОНЕДЕЛЬНИКИ НЕ СЧИТАЮТСЯ</div>
          <div style="font-size:10px;color:var(--text3)">Срок указывается в рабочих днях (пн — выходной)</div>
        </div>
        <div class="prev">
          <div style="font-size:9px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-bottom:7px;text-transform:uppercase;letter-spacing:1px">Предпросмотр</div>
          <div class="prev-row"><span class="prev-lbl">Итого получу:</span><span class="prev-val green" id="pv-total">${fmt(prevTotal)}</span></div>
          <div class="prev-row"><span class="prev-lbl">Прибыль:</span><span class="prev-val purple" id="pv-profit">${fmt(prevProfit)}</span></div>
          <div class="prev-row"><span class="prev-lbl">% доходности:</span><span class="prev-val gold" id="pv-pct">${nb.loan?Math.round(prevProfit/Number(nb.loan)*100):0}%</span></div>
        </div>
        <div class="btn-row">
          <button class="btn-c" onclick="closeAdd()">Отмена</button>
          <button class="btn-s" onclick="addBorrower()" ${!nb.name.trim()?'disabled':''} id="btn-save">Сохранить</button>
        </div>
      </div>
    </div>`;
  }
  return h;
}

function openAdd(){ S.showAdd=true; render(); }
function closeAdd(e){
  if(e&&e.target!==e.currentTarget) return;
  S.showAdd=false; render();
}
function un(k,v){
  S.nb[k]=v;
  const nb=S.nb;
  const t=Number(nb.daily)*(Number(nb.term)-1)+Number(nb.lastDay);
  const p=t-Number(nb.loan);
  const pctV=nb.loan?Math.round(p/Number(nb.loan)*100):0;
  const el=id=>document.getElementById(id);
  if(el('pv-total')) el('pv-total').textContent=fmt(t);
  if(el('pv-profit')) el('pv-profit').textContent=fmt(p);
  if(el('pv-pct')) el('pv-pct').textContent=pctV+'%';
  if(el('btn-save')) el('btn-save').disabled=!String(nb.name).trim();
}

// ─── INIT ────────────────────────────────────────────────────
render();

// Offline SW
if('serviceWorker' in navigator){
  const sw=`const C='zt3-v1';
self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll([location.href])));self.skipWaiting();});
self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));});`;
  const blob=new Blob([sw],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
</body>
</html>
